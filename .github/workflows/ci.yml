name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          package-manager-cache: false
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Build
        run: npm run build
